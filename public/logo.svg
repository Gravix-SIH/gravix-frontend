<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern gradient for the background -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
    
    <!-- Shadow effect -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App icon background with rounded rectangle (iOS style) -->
  <rect x="20" y="20" width="160" height="160" rx="35" ry="35" 
        fill="url(#mainGradient)" 
        filter="url(#shadow)"/>
  
  <!-- Main logo mark - stylized "M" that forms a brain/mind shape -->
  <g transform="translate(100,100)" filter="url(#glow)">
    <!-- Left side of M -->
    <path d="M -35,-30 L -35,25 L -25,25 L -25,-15 L -10,-30 L -5,-25 L -5,25 L 5,25 L 5,-25 L 10,-30 L 25,-15 L 25,25 L 35,25 L 35,-30 L 20,-45 L 5,-30 L -10,-45 L -35,-30 Z" 
          fill="white" opacity="0.95"/>
    
    <!-- Modern accent dots -->
    <circle cx="-15" cy="-35" r="3" fill="white" opacity="0.8"/>
    <circle cx="15" cy="-35" r="3" fill="white" opacity="0.8"/>
    <circle cx="0" cy="-40" r="2" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Subtle highlight on top -->
  <rect x="20" y="20" width="160" height="80" rx="35" ry="35" 
        fill="url(#mainGradient)" 
        opacity="0.3"/>
</svg>